services:
  pihole:
    container_name: pihole
    image: docker.io/pihole/pihole:latest
    #network_mode: "host"
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8001:80/tcp"  # Map internal port 80 to host port 8001
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
      - SYS_TIME
    environment:
      TZ: 'America/New_York'
      FTLCONF_ntp_ipv4: '10.0.0.1'
      #FTLCONF_webserver_port: '8001'
      FTLCONF_webserver_tls_port: ''
      FTLCONF_webserver_api_password: 'secure-password-here'
      FTLCONF_dns_upstreams: '1.1.1.1;1.0.0.1'
    volumes:
      - './etc-pihole:/etc/pihole:Z'
      - './etc-dnsmasq.d:/etc/dnsmasq.d:Z'
    restart: always
