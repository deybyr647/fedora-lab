services:
  stirling-pdf:
    container_name: stirling-pdf
    image: docker.io/frooodle/s-pdf:latest
    ports:
      - '8003:8080'
    environment:
      DOCKER_ENABLE_SECURITY: 'false'
      INSTALL_BOOK_AND_ADVANCED_HTML_OPS: 'true'
      LANGS: 'en_US'
    volumes:
      - './extraConfigs:/configs:Z'
      - './customFiles:/customFiles:Z'
    restart: always
